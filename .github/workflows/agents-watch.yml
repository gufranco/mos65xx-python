name: Agents watch

# This repository keeps one instruction file, AGENTS.md. Most coding agents read
# it directly and need nothing else; the rest each look for a file of their own,
# so each of those carries a pointer saying where the instructions are.
#
# That arrangement ages the moment a new agent ships, and nothing in a build
# notices: an agent nobody here has heard of reads nothing, and the silence looks
# exactly like being covered.
#
# So this asks agents.md, weekly, which agents now read AGENTS.md, and opens an
# issue naming any the record does not hold. A name on that list needs no file
# here, so the change it asks for is one line in conformance/agent-files.json.
#
# An agent that does not read AGENTS.md never appears on that page, so its
# pointer is still added by hand. The page says which tools read the file and
# never says what a tool that does not would read instead, and a pointer at a
# guessed path is a file nothing opens.
#
# The judgement about what counts as a page that was read at all lives in
# conformance/agents_support.py where the test suite covers it, rather than
# inline here where nothing would.

on:
  schedule:
    # Early Monday, UTC, after the other two watchers so the three do not
    # compete for a runner or for a reader's attention.
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: agents-watch
  cancel-in-progress: false

jobs:
  ask:
    name: Ask which agents now read the instruction file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ask
        id: ask
        run: |
          set +e
          python conformance/agents_support.py | tee /tmp/agents.json
          echo "new=$?" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Say what the page said without raising it
        run: |
          python - <<'REPORT'
          import json
          from pathlib import Path

          held = json.loads(Path("/tmp/agents.json").read_text())
          if not held["read"]:
              print(f"the page gave {held['found']} names, too few to believe; nothing reported")
          else:
              print(f"{held['found']} agents listed")
              for name in held["gone"]:
                  print(f"no longer listed: {name}")
          REPORT
        shell: bash

      - name: Report the agents this repository does not name
        if: steps.ask.outputs.new != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="An agent reads AGENTS.md and this record does not name it"
          if [ -n "$(gh issue list --search "${title} in:title" --state open --json number --jq '.[].number')" ]; then
            echo "already reported"
            exit 0
          fi
          gh issue create --title "${title}" --body-file - <<BODY
          The adopter list published at https://agents.md/ names one or more agents that \`conformance/agent-files.json\` does not hold. Each of them reads AGENTS.md directly, so none needs a file here and the change is to add the names under \`readsAgentsFile\`.

          Worth checking first: that each name really is a new adopter rather than a rename of one already listed. A rename would otherwise leave the old name sitting in the record as an agent that no longer exists.

          \`\`\`json
          $(cat /tmp/agents.json)
          \`\`\`
          BODY
        shell: bash
