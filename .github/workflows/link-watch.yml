---
name: Link watch

on:
  schedule:
    - cron: "43 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-watch
  cancel-in-progress: false

jobs:
  ask:
    name: Ask every address whether it still answers
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ask
        id: ask
        run: |
          set +e
          python -m conformance.links | tee /tmp/links.json
          echo "broken=${PIPESTATUS[0]}" >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Say what went quiet without raising it
        run: |
          quiet=$(python - <<'PY'
          import json
          with open("/tmp/links.json") as held:
              print("\n".join(json.load(held)["unreachable"]))
          PY
          )
          if [ -n "${quiet}" ]; then
            echo "These did not answer, which is not the same as being gone:"
            echo "${quiet}"
          else
            echo "every address answered"
          fi
        shell: bash

      - name: Report the addresses that have gone
        if: steps.ask.outputs.broken != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="A cited link no longer resolves"
          open=$(gh issue list --search "${title} in:title" \
            --state open --json number --jq '.[].number')
          if [ -n "${open}" ]; then
            echo "already reported"
            exit 0
          fi
          {
            cat .github/link-gone.md
            printf '\n```json\n'
            cat /tmp/links.json
            printf '```\n'
          } > /tmp/issue.md
          gh issue create --title "${title}" --body-file /tmp/issue.md
        shell: bash
