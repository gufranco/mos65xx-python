name: Suite watch

# The suites are pinned by commit so a build is reproducible and a red run always
# has a commit of its own to explain it. That pin is also how a repository stops
# noticing that the oracle it is judged against has moved.
#
# So this runs weekly against whatever upstream holds now. It never changes a pin
# on its own. If the newer suite passes it opens a pull request proposing the
# bump, with the run behind it. If the newer suite fails it opens an issue, because
# either the suite found a real defect here or upstream changed its mind about the
# hardware. Both are worth a person reading.
#
# The six suites here do not come from one place: the 65816 cases live in
# ProcessorTests and the other five live in 65x02. A watcher that probed one
# definition and stopped would report on one suite and silently ignore five, and a
# green watcher badge reads as coverage. So the survey groups the definitions by
# repository and probes each group, and the survey itself lives in
# conformance/watch.py where the test suite covers it rather than inline here
# where nothing does.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: suite-watch
  cancel-in-progress: false

jobs:
  survey:
    name: Ask every upstream where it is now
    runs-on: ubuntu-latest
    outputs:
      moved: ${{ steps.ask.outputs.moved }}
      any: ${{ steps.ask.outputs.any }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Ask
        id: ask
        run: |
          moved=$(python conformance/watch.py --moved)
          echo "moved=${moved}" >> "${GITHUB_OUTPUT}"
          if [ "${moved}" = "[]" ]; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
            echo "every pinned repository is still where it was"
          else
            echo "any=true" >> "${GITHUB_OUTPUT}"
            echo "${moved}"
          fi
        shell: bash

  revalidate:
    name: ${{ matrix.group.repository }}
    needs: survey
    if: needs.survey.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One repository moving must not stop the other from being checked, and a
      # failure in one must not hide a pass in the other.
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.survey.outputs.moved) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch every suite from that repository at the newer commit
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, "conformance")
          import fetch

          group = json.loads(os.environ["GROUP"])
          for suite in fetch.definitions():
              if suite["name"] not in group["suites"]:
                  continue
              where = fetch.fetch(
                  suite,
                  pathlib.Path.home() / ".cache" / "suite" / suite["name"],
                  group["latest"],
              )
              print(f"{suite['name']} {where}")
          PY
        shell: bash
        env:
          GROUP: ${{ toJSON(matrix.group) }}

      # Every suite that repository carries, not just the first. A pass reported
      # for one suite while another was never run is the failure this file exists
      # to stop.
      - name: Run every suite from that repository
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          : > /tmp/report.txt
          for suite in $(python - <<'PY'
          import json, os
          print(" ".join(json.loads(os.environ["GROUP"])["suites"]))
          PY
          ); do
            path=$(python - "${suite}" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "conformance")
          import fetch
          for suite in fetch.definitions():
              if suite["name"] == sys.argv[1]:
                  print(pathlib.Path.home() / ".cache" / "suite" / suite["name"] / suite["path"])
                  break
          PY
          )
            echo "::group::${suite}"
            echo "### ${suite}" >> /tmp/report.txt
            # The exit code has to be read in this shell rather than inside the
            # pipeline, because a pipeline runs in a subshell and an assignment
            # made there is lost. Reporting a pass for a suite that failed is
            # exactly the failure this file exists to stop.
            if ! python conformance/singlestep.py "${path}" | tee -a /tmp/report.txt; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"
        shell: bash
        env:
          GROUP: ${{ toJSON(matrix.group) }}

      - name: Propose the bump
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ matrix.group.latest }}
          PINNED: ${{ matrix.group.pinned }}
          SUITES: ${{ join(matrix.group.suites, ', ') }}
        run: |
          branch="suite/${LATEST:0:12}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "already proposed"
            exit 0
          fi
          python - <<'PY'
          import os, pathlib

          path = pathlib.Path("conformance/suites.json")
          path.write_text(path.read_text().replace(os.environ["PINNED"], os.environ["LATEST"]))
          PY
          git switch -c "${branch}"
          git add conformance/suites.json
          git commit -m "test: move the ${SUITES} pin to ${LATEST:0:12}"
          git push -u origin "${branch}"
          gh pr create \
            --title "test: move the ${SUITES} pin to ${LATEST:0:12}" \
            --body-file - <<BODY
          Upstream has moved and every suite that repository carries still passes against the newer commit, so the pin can follow it. No source change is needed.

          Suites re-run: ${SUITES}. Was \`${PINNED}\`, now \`${LATEST}\`.

          $(cat /tmp/report.txt)
          BODY
        shell: bash

      - name: Report the disagreement
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ matrix.group.latest }}
          PINNED: ${{ matrix.group.pinned }}
          SUITES: ${{ join(matrix.group.suites, ', ') }}
        run: |
          title="Conformance fails against suite ${LATEST:0:12}"
          if [ -n "$(gh issue list --search "${title} in:title" --state open --json number --jq '.[].number')" ]; then
            echo "already reported"
            exit 0
          fi
          gh issue create --title "${title}" --body-file - <<BODY
          The pinned suites still pass. A newer upstream commit does not, so either it found a real defect here or upstream changed what it believes the hardware does. The pin has not moved.

          Suites re-run: ${SUITES}. Pinned \`${PINNED}\`, tried \`${LATEST}\`.

          $(cat /tmp/report.txt)
          BODY
        shell: bash
