---
name: Suite watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: suite-watch
  cancel-in-progress: false

jobs:
  survey:
    name: Ask every upstream where it is now
    runs-on: ubuntu-26.04
    outputs:
      moved: ${{ steps.ask.outputs.moved }}
      any: ${{ steps.ask.outputs.any }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ask
        id: ask
        run: |
          moved=$(python -m conformance.watch --moved)
          echo "moved=${moved}" >> "${GITHUB_OUTPUT}"
          if [ "${moved}" = "[]" ]; then
            echo "any=false" >> "${GITHUB_OUTPUT}"
            echo "every pinned repository is still where it was"
          else
            echo "any=true" >> "${GITHUB_OUTPUT}"
            echo "${moved}"
          fi
        shell: bash

  revalidate:
    name: ${{ matrix.group.repository }}
    needs: survey
    if: needs.survey.outputs.any == 'true'
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.survey.outputs.moved) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch every suite from that repository at the newer commit
        run: |
          python - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, "conformance")
          import fetch

          group = json.loads(os.environ["GROUP"])
          for suite in fetch.definitions():
              if suite["name"] not in group["suites"]:
                  continue
              where = fetch.fetch(
                  suite,
                  pathlib.Path.home() / ".cache" / "suite" / suite["name"],
                  group["latest"],
              )
              print(f"{suite['name']} {where}")
          PY
        shell: bash
        env:
          GROUP: ${{ toJSON(matrix.group) }}

      - name: Run every suite from that repository
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          : > /tmp/report.txt
          for suite in $(python - <<'PY'
          import json, os
          print(" ".join(json.loads(os.environ["GROUP"])["suites"]))
          PY
          ); do
            path=$(python - "${suite}" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, "conformance")
          import fetch
          for suite in fetch.definitions():
              if suite["name"] == sys.argv[1]:
                  print(pathlib.Path.home() / ".cache" / "suite" / suite["name"] / suite["path"])
                  break
          PY
          )
            echo "::group::${suite}"
            echo "### ${suite}" >> /tmp/report.txt
            if ! python -m conformance.singlestep "${path}" | tee -a /tmp/report.txt; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"
        shell: bash
        env:
          GROUP: ${{ toJSON(matrix.group) }}

      - name: Propose the bump
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ matrix.group.latest }}
          PINNED: ${{ matrix.group.pinned }}
          SUITES: ${{ join(matrix.group.suites, ', ') }}
        run: |
          branch="suite/${LATEST:0:12}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "already proposed"
            exit 0
          fi
          python - <<'PY'
          import os, pathlib

          path = pathlib.Path("conformance/suites.json")
          path.write_text(path.read_text().replace(os.environ["PINNED"], os.environ["LATEST"]))
          PY
          git switch -c "${branch}"
          git add conformance/suites.json
          git commit -m "test: move the ${SUITES} pin to ${LATEST:0:12}"
          git push -u origin "${branch}"
          {
            cat .github/suite-moved.md
            printf '\nSuites re-run: %s. Was %s, now %s.\n\n' \
              "${SUITES}" "\`${PINNED}\`" "\`${LATEST}\`"
            cat /tmp/report.txt
          } > /tmp/pr.md
          gh pr create \
            --title "test: move the ${SUITES} pin to ${LATEST:0:12}" \
            --body-file /tmp/pr.md
        shell: bash

      - name: Report the disagreement
        if: steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ matrix.group.latest }}
          PINNED: ${{ matrix.group.pinned }}
          SUITES: ${{ join(matrix.group.suites, ', ') }}
        run: |
          title="Conformance fails against suite ${LATEST:0:12}"
          open=$(gh issue list --search "${title} in:title" \
            --state open --json number --jq '.[].number')
          if [ -n "${open}" ]; then
            echo "already reported"
            exit 0
          fi
          {
            cat .github/suite-failed.md
            printf '\nSuites re-run: %s. Pinned %s, tried %s.\n\n' \
              "${SUITES}" "\`${PINNED}\`" "\`${LATEST}\`"
            cat /tmp/report.txt
          } > /tmp/issue.md
          gh issue create --title "${title}" --body-file /tmp/issue.md
        shell: bash
