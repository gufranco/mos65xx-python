version: 2

# One pull request per ecosystem per week rather than one per dependency.
#
# Ungrouped, a week of updates arrives as half a dozen pull requests that each
# touch the same manifest and lockfile. The first to merge puts every other one
# into conflict, and each then needs its lockfile regenerated by hand. Grouping
# turns that into one branch that is either coherent or not.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      build-requirements:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    labels:
      - dependencies
    groups:
      release-tooling:
        patterns:
          - "*"
